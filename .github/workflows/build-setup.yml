name: Build Windows setup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'installer/**', '.github/workflows/build-setup.yml']
    tags: ['v*']
permissions:
  contents: write
  actions: read
concurrency:
  group: build-setup-release   # main và tag v* cùng commit không được đăng song song (kiểm 'đã có Release' không còn bị đua)
  cancel-in-progress: false
jobs:
  setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build HAKDocs.exe from source (Windows OCR + Save helper)
        shell: pwsh
        run: |
          & ./installer/native/build.ps1
          if (-not (Test-Path app/native/HAKDocs.exe)) { throw 'HAKDocs.exe was not built' }
          Get-Item app/native/HAKDocs.exe | Format-List Name, Length, LastWriteTime
      - name: Smoke-test HAKDocs.exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath app/native/HAKDocs.exe -ArgumentList '--serve' -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 20 -and -not $ok; $i++) {
              Start-Sleep -Milliseconds 500
              try { $r = Invoke-WebRequest -Uri http://127.0.0.1:31879/status -UseBasicParsing; $ok = ($r.StatusCode -eq 200) } catch { }
            }
            if (-not $ok) { throw 'HAKDocs --serve did not answer /status' }
            Write-Host "status: $($r.Content)"
            # mã bảo vệ do HAKDocs ghi ra (native/hakdocs-token.js): thiếu mã → 403, đúng mã → chạy
            $tok = [regex]::Match((Get-Content app/native/hakdocs-token.js -Raw), "HAK_DOCS_TOKEN='([0-9a-f]{32})'").Groups[1].Value
            if (-not $tok) { throw 'HAKDocs did not write hakdocs-token.js' }
            $nt = Invoke-WebRequest -Uri http://127.0.0.1:31879/download-files -Method Post -Headers @{ 'X-HAK-Client' = 'documents-v1'; 'Content-Type' = 'application/json' } -Body '{"action":"list"}' -UseBasicParsing -SkipHttpErrorCheck
            if ($nt.StatusCode -ne 403) { throw "request without token returned $($nt.StatusCode), expected 403" }
            $wt = Invoke-WebRequest -Uri http://127.0.0.1:31879/download-files -Method Post -Headers @{ 'X-HAK-Client' = 'documents-v1'; 'X-HAK-Token' = 'deadbeefdeadbeefdeadbeefdeadbeef'; 'Content-Type' = 'application/json' } -Body '{"action":"list"}' -UseBasicParsing -SkipHttpErrorCheck
            if ($wt.StatusCode -ne 403) { throw "request with wrong token returned $($wt.StatusCode), expected 403" }
            $h = @{ 'X-HAK-Client' = 'documents-v1'; 'X-HAK-Token' = $tok; 'Content-Type' = 'application/json' }
            # file operations answer normally (list saved downloads)
            $l = Invoke-WebRequest -Uri http://127.0.0.1:31879/download-files -Method Post -Headers $h -Body '{"action":"list"}' -UseBasicParsing
            if ($l.StatusCode -ne 200) { throw "download-files list returned $($l.StatusCode)" }
            # an oversized request must get a real 413 answer (not a connection reset => browser 'Failed to fetch')
            $big = New-Object byte[] (40MB)
            $b = Invoke-WebRequest -Uri http://127.0.0.1:31879/save-download -Method Post -Headers $h -Body $big -UseBasicParsing -SkipHttpErrorCheck
            if ($b.StatusCode -ne 413) { throw "oversized request returned $($b.StatusCode), expected 413" }
            Write-Host 'HAKDocs smoke test passed'
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
      - name: Build setup.exe
        shell: pwsh
        run: |
          Copy-Item app installer/app -Recurse
          # KHÔNG đóng mã bảo vệ sinh trong CI vào bộ cài: mỗi máy tự sinh mã riêng ở lần chạy đầu
          Set-Content -Path installer/app/native/hakdocs-token.js -Value "window.HAK_DOCS_TOKEN='';" -Encoding ascii
          Copy-Item installer/icon/app.ico installer/app/app.ico
          Remove-Item installer/app/MoKhoa_1Lan*.html, installer/app/XoaSach_DuLieu*.html -ErrorAction SilentlyContinue
          $ver = (Select-String -Path installer/setup.nsi -Pattern '!define VERSION "([^"]+)"').Matches[0].Groups[1].Value
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          $mk = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe", "C:\ProgramData\chocolatey\lib\nsis\tools\makensis.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mk) { $cmd = Get-Command makensis -ErrorAction SilentlyContinue; if ($cmd) { $mk = $cmd.Source } }
          if (-not $mk) { Get-ChildItem 'C:\Program Files*' -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 3 | ForEach-Object { Write-Host "found: $($_.FullName)" }; throw 'makensis.exe not found' }
          Write-Host "makensis: $mk"
          & $mk /DVERSION=$ver installer/setup.nsi
          if ($LASTEXITCODE -ne 0) { throw 'makensis failed' }
          Move-Item installer/HAK_QuanLyXuatHang_Setup.exe "HAK_QuanLyXuatHang_Setup_v$ver.exe"
          Get-FileHash "HAK_QuanLyXuatHang_Setup_v$ver.exe" -Algorithm SHA256 | Format-List
          "SETUP=HAK_QuanLyXuatHang_Setup_v$ver.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SHA256=$((Get-FileHash "HAK_QuanLyXuatHang_Setup_v$ver.exe" -Algorithm SHA256).Hash.ToLower())" | Out-File -FilePath $env:GITHUB_ENV -Append   # ghi vào ghi chú phát hành để đối chiếu toàn vẹn file tải về
      - name: Accept install, upgrade, failure and uninstall of this setup
        shell: pwsh
        run: |
          & ./installer/test-setup.ps1 -SetupPath "$env:SETUP" -ExpectedVersion "$env:VERSION"
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # hết dung lượng artifact của GitHub không được chặn việc đăng bản phát hành (file cài đặt vẫn đính kèm ở Release)
        with:
          name: HAK_QuanLyXuatHang_Setup
          path: HAK_QuanLyXuatHang_Setup_v*.exe
      - name: Check release already published
        id: rel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Không ghi đè bản phát hành đã đăng: cùng số phiên bản thì tag giữ nguyên commit cũ nhưng file cài / SHA-256 / ghi chú sẽ bị thay bằng bản dựng mới.
          gh release view "v$env:VERSION" --repo "$env:GITHUB_REPOSITORY" *> $null
          $exists = ($LASTEXITCODE -eq 0)
          "EXISTS=$($exists.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($exists) { Write-Host "Release v$env:VERSION đã có — KHÔNG ghi đè. Muốn phát hành bản mới: nâng số phiên bản (version.js + installer/setup.nsi)." }
          $global:LASTEXITCODE = 0
      - name: Wait for quality acceptance of this commit
        if: steps.rel.outputs.EXISTS != 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $deadline = (Get-Date).AddMinutes(25)
          do {
            $json = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?head_sha=$env:GITHUB_SHA&event=push&per_page=10"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read quality workflow results' }
            $run = ($json | ConvertFrom-Json).workflow_runs | Sort-Object created_at -Descending | Select-Object -First 1
            if ($run -and $run.status -eq 'completed') {
              if ($run.conclusion -ne 'success') { throw "Quality acceptance failed: $($run.conclusion) $($run.html_url)" }
              Write-Host "Quality acceptance passed: $($run.html_url)"
              break
            }
            if ((Get-Date) -ge $deadline) { throw 'Timed out waiting for quality acceptance; setup has not been published' }
            Start-Sleep -Seconds 20
          } while ($true)
      - name: Publish release
        if: steps.rel.outputs.EXISTS != 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: HAK Quản lý xuất hàng v${{ env.VERSION }}
          body: |
            Bộ cài Windows **v${{ env.VERSION }}** — dựng tự động từ commit ${{ github.sha }}.
            Tải file `HAK_QuanLyXuatHang_Setup_v${{ env.VERSION }}.exe`, chạy để cài / cập nhật (giữ nguyên đường dẫn cài mặc định để không mất dữ liệu).
            SHA-256: `${{ env.SHA256 }}` (PowerShell: `Get-FileHash .\HAK_QuanLyXuatHang_Setup_v${{ env.VERSION }}.exe`).
            Bộ cài chưa ký số: Windows có thể hiện cảnh báo SmartScreen. Chi tiết thay đổi: NHAT_KY_PHIEN_BAN.md.
          files: HAK_QuanLyXuatHang_Setup_v*.exe
          fail_on_unmatched_files: true
