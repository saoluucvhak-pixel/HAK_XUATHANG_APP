name: HAK quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci   # khóa phiên bản công cụ lint bằng package-lock.json
      - run: npm run check
      - run: npm run format:check   # Prettier: định dạng thống nhất (chạy npm run format để sửa)
      - run: npm run lint   # ESLint: biến chưa khai báo (no-undef), khóa trùng, mã không tới được
      - run: npm test
      - run: npm run quality
      - run: npm run release
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # hết dung lượng artifact của GitHub không được làm đỏ CI
        with:
          name: hak-quality-node-${{ matrix.node }}
          path: reports/quality/

  smoke:
    # Mở app thật trên Chromium: không được có lỗi script (bắt lỗi thứ tự nạp / tách file) + luồng xuyên màn hình + nghiệm thu phát hành
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci   # gồm pdfjs-dist (devDependency) để đọc lại file PDF xuất ra
      - run: npm i --no-save playwright@1.63.0   # chỉ dùng trong CI, không thêm vào dependencies
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - run: npm run ui-audit   # tràn ngang, tương phản WCAG AA (4 chủ đề × sáng/tối), nhãn truy cập
      - run: npm run e2e   # hai tàu cân xen kẽ: nhập, đổi sheet, chọn phiếu, lưu, mở lại, Excel, báo cáo
      - run: npm run e2e:carrier   # chi tiết đơn vị vận chuyển khớp bảng tổng khi lọc theo ngày cân
      - run: npm run e2e:reports   # 5 mẫu báo cáo + bảng chéo kho × hình thức: màn hình, tra cứu, Excel, bản in, phạm vi công ty
      - run: npm run e2e:customs   # nhập tờ khai Excel, OCR giấy nộp tiền (giả lập OCR), nhập lại, khai bổ sung, hoàn thuế, hủy, phạm vi công ty
      - run: npm run e2e:bkls-scope   # Lập BKLS phải hỏi xác nhận phạm vi như Word / PDF / Excel
      - run: npm run e2e:contract-status   # trạng thái "Đã hoàn thành" của hợp đồng: Danh mục, báo cáo, bộ lọc, Hồ sơ hợp đồng cùng một nguồn (có phiếu cân)
      - run: npm run e2e:nonpositive   # phiếu KL ≤ 0 không cộng vào tổng, liệt kê ở Ngoại lệ cần đối soát
      - run: npm run e2e:export-parity   # màn hình = Excel = Word = PDF cùng tập phiếu (ca sát biên ngày/giờ, biển số chuẩn hóa, phiếu KL ≤ 0)
      - run: npm run e2e:dialogs   # hộp thoại: Tab không rơi ra nền, Esc đóng, tiêu điểm trả về nút đã mở, hộp chồng nhau
      - run: npm run e2e:roundtrip   # sao lưu → xóa → khôi phục vòng tròn (IndexedDB): số liệu trước = sau; khôi phục lặp không nhân đôi; file hỏng bị từ chối
      - run: npm run e2e:bkls-readback   # đọc lại riêng BKLS (Word tổng + từng xe, PDF): đúng tập phiếu / khối lượng, phiếu KL ≤ 0 không có
      - run: npm run e2e:persist-keys   # bộ lọc đã lưu · Năm làm việc · giao diện bền khi mở lại app, giữ khóa cũ khi nâng cấp, có trong sao lưu → khôi phục
      - run: node tools/e2e-sqlite.cjs tools/e2e-persist-keys.cjs   # như trên trên SQLite (hydrate không được xóa khóa hak.*)
      - run: npm run e2e:roundtrip-cross   # sao lưu ở backend này → khôi phục ở backend kia (IDB↔SQLite, 4 hướng)
      - run: npm run e2e:month-backup   # sao lưu THEO THÁNG: máy trống / máy đã có tháng khác, lặp không nhân đôi, hồ sơ qua 2 tháng, hợp đồng dùng chung, thay thế bị từ chối
      - run: node tools/e2e-sqlite.cjs tools/e2e-month-backup.cjs   # như trên trên SQLite
      - run: npm run e2e:sqlite-backup   # tự sao lưu SQLite: tới hạn / chưa tới hạn, xoay vòng giữ N, chỉ xóa HAK_SQLite_*.db, thư mục không ghi được
      - run: npm run e2e:backup-ui   # tab Sao lưu & khôi phục: 6 khối, tải xuống, khôi phục một nút tự nhận loại file
      - run: npm run e2e:backup-ui-sqlite
      - run: npm run e2e:sf-focus   # Bộ lọc nâng cao: vẽ lại giữ tiêu điểm đúng ô; tiêu đề không lộ mã nội bộ (đồng bộ repo gốc HAK_SMART_FILTER)
      - run: node tools/e2e-sqlite.cjs tools/e2e-sf-focus.cjs
      - run: npm run e2e:company-scope   # tách theo công ty: ô hợp đồng, Chứng từ, Tìm kiếm không lộ công ty khác; bộ lọc đã lưu theo tài khoản + công ty
      - run: node tools/e2e-sqlite.cjs tools/e2e-company-scope.cjs
      - run: node tools/e2e-sqlite.cjs tools/e2e-roundtrip.cjs   # như trên trên SQLite (máy chủ tham chiếu)
      - run: npm run e2e:archive-ops   # lưu / lưu lặp / xóa hồ sơ Lưu trữ kèm lỗi giữa chừng; mục lục ↔ nội dung khớp (IndexedDB)
      - run: node tools/e2e-sqlite.cjs tools/e2e-archive-ops.cjs   # như trên trên SQLite, kể cả mất phản hồi sau khi đã ghi
      - run: npm run e2e:gsync-parity   # Google Sheet GIẢ LẬP (chạy đúng Code.gs): KL ≤ 0 loại, đồng bộ lại / mất phản hồi không nhân đôi, trạng thái hợp đồng một nguồn
      - run: npm run e2e:import-warn   # nhập tờ khai / khai bổ sung từ Excel: ô dạng ngoặc "(1.200)" được cảnh báo (quy tắc 28), nhập lại không trùng
      - run: node tools/e2e-sqlite.cjs tools/e2e-import-warn.cjs
      - run: node tools/e2e-sqlite.cjs tools/e2e-contract-status.cjs   # trạng thái hợp đồng một nguồn trên SQLite
      - run: npm run accept:release   # Word và PDF BẮT BUỘC: thiếu / không đọc lại được file → lỗi (chưa xác minh)

  accept-windows:
    # Nghiệm thu phát hành trên Windows với Microsoft Edge đã cài sẵn trên runner: xuất rồi ĐỌC LẠI Word / Excel / PDF
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm i --no-save playwright@1.63.0
      - name: Dừng HAKDocs theo thư mục cài (không ảnh hưởng bản cài khác)
        shell: pwsh
        run: |
          # Ba "HAKDocs.exe" giả (bản sao ping.exe) ở ba thư mục: a, b và a2 (tên bắt đầu giống a). Dừng theo thư mục a chỉ được dừng a.
          $ping = (Get-Command ping.exe).Source
          $dirs = 'hak-a', 'hak-b', 'hak-a2' | ForEach-Object { Join-Path $env:RUNNER_TEMP $_ }
          $procs = @{}
          foreach ($d in $dirs) {
            New-Item -ItemType Directory -Force (Join-Path $d 'native') | Out-Null
            $exe = Join-Path $d 'native\HAKDocs.exe'
            Copy-Item $ping $exe
            $procs[$d] = Start-Process -FilePath $exe -ArgumentList '-n', '300', '127.0.0.1' -PassThru -WindowStyle Hidden
          }
          Start-Sleep -Seconds 2
          function Stop-For($d) { & powershell.exe -NoProfile -ExecutionPolicy Bypass -File installer/stop-hakdocs.ps1 -InstallDir $d; Start-Sleep -Seconds 1 }
          Stop-For $dirs[0]
          if (-not $procs[$dirs[0]].HasExited) { throw 'không dừng được HAKDocs của thư mục a' }
          if ($procs[$dirs[1]].HasExited) { throw 'dừng nhầm HAKDocs của thư mục b' }
          if ($procs[$dirs[2]].HasExited) { throw 'dừng nhầm HAKDocs của thư mục a2 (tên bắt đầu giống a)' }
          Stop-For $dirs[1]; Stop-For $dirs[2]
          if (-not $procs[$dirs[1]].HasExited -or -not $procs[$dirs[2]].HasExited) { throw 'không dừng được HAKDocs còn lại' }
          Write-Host 'Dừng theo thư mục cài: đúng'
      - name: Dựng HAKDocs.exe (SQLite) và thử hợp đồng cơ sở dữ liệu trên máy thật
        shell: pwsh
        run: |
          & ./installer/native/build.ps1
          if (-not (Test-Path app/native/HAKDocs.exe)) { throw 'HAKDocs.exe was not built' }
          # Thư mục dữ liệu thử CÓ DẤU TIẾNG VIỆT và khoảng trắng (đường dẫn UTF-8 phải mở được).
          $env:HAK_DATA_DIR = Join-Path $env:RUNNER_TEMP 'dữ liệu HAK ƯT'
          $p = Start-Process -FilePath app/native/HAKDocs.exe -ArgumentList '--serve' -PassThru -WindowStyle Hidden
          $up = $false
          for ($i = 0; $i -lt 40 -and -not $up; $i++) { try { Invoke-RestMethod http://127.0.0.1:31879/status -TimeoutSec 2 | Out-Null; $up = $true } catch { Start-Sleep -Milliseconds 500 } }
          if (-not $up) { throw 'HAKDocs không trả lời' }
          $tok = [regex]::Match((Get-Content app/native/hakdocs-token.js -Raw), "HAK_DOCS_TOKEN='([0-9a-f]{32})'").Groups[1].Value
          node tools/hakdb/contract.cjs http://127.0.0.1:31879 $tok
          $code = $LASTEXITCODE
          if (-not (Test-Path (Join-Path $env:HAK_DATA_DIR 'hak.db'))) { throw 'không thấy hak.db trong thư mục dữ liệu có dấu' }
          Stop-Process -Id $p.Id -Force
          if ($code -ne 0) { throw 'Hợp đồng cơ sở dữ liệu trên HAKDocs.exe có ca lỗi' }
      - name: Nghiệm thu phát hành (Edge)
        shell: pwsh
        env:
          HAK_BROWSER_CHANNEL: msedge
        run: npm run accept:release
      - name: Nghiệm thu trên SQLite (HAKDocs.exe thật + Edge)
        shell: pwsh
        env:
          HAK_BROWSER_CHANNEL: msedge
        run: |
          $env:HAK_DATA_DIR = Join-Path $env:RUNNER_TEMP 'dữ liệu HAK ƯT e2e'
          $env:HAK_DB_ACTIVATE = '1'
          $p = Start-Process -FilePath app/native/HAKDocs.exe -ArgumentList '--serve' -PassThru -WindowStyle Hidden
          $up = $false
          for ($i = 0; $i -lt 40 -and -not $up; $i++) { try { Invoke-RestMethod http://127.0.0.1:31879/status -TimeoutSec 2 | Out-Null; $up = $true } catch { Start-Sleep -Milliseconds 500 } }
          if (-not $up) { throw 'HAKDocs không trả lời' }
          $env:HAK_DB_EXTERNAL_TOKEN = [regex]::Match((Get-Content app/native/hakdocs-token.js -Raw), "HAK_DOCS_TOKEN='([0-9a-f]{32})'").Groups[1].Value
          node tools/e2e-sqlite.cjs tools/e2e-customs.cjs
          $a = $LASTEXITCODE
          node tools/e2e-sqlite.cjs tools/accept.cjs --release
          $b = $LASTEXITCODE
          Stop-Process -Id $p.Id -Force
          if ($a -ne 0 -or $b -ne 0) { throw "Nghiệm thu SQLite lỗi (e2e:customs=$a, accept:release=$b)" }
