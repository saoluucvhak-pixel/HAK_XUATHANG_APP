name: HAK quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci   # khóa phiên bản công cụ lint bằng package-lock.json
      - run: npm run check
      - run: npm run format:check   # Prettier: định dạng thống nhất (chạy npm run format để sửa)
      - run: npm run lint   # ESLint: biến chưa khai báo (no-undef), khóa trùng, mã không tới được
      - run: npm test
      - run: npm run quality
      - run: npm run release
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # hết dung lượng artifact của GitHub không được làm đỏ CI
        with:
          name: hak-quality-node-${{ matrix.node }}
          path: reports/quality/

  smoke:
    # Mở app thật trên Chromium: không được có lỗi script (bắt lỗi thứ tự nạp / tách file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm i --no-save playwright@1.63.0   # chỉ dùng trong CI, không thêm vào dependencies
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - run: npm run ui-audit   # tràn ngang, tương phản WCAG AA (4 chủ đề × sáng/tối), nhãn truy cập
