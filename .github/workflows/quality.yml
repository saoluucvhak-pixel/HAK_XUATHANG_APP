name: HAK quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - run: npm run quality
      - run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: hak-quality-node-${{ matrix.node }}
          path: reports/quality/
